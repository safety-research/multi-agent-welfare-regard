http_port 3128
acl SSL_ports port 443
acl CONNECT method CONNECT
# The whole allowlist: the three provider API endpoints the seats may be served by, and the
# chat server. Exact domains only, never a suffix match. Everything else is denied, so an
# agent in a rollout cannot reach PyPI, GitHub, or the open web — which is why a ticket's
# dependencies are baked in advance (see ../materialize_tasks.py).
# -n: match the name the client asked for, never a reverse DNS lookup of a bare IP address.
# Without it a CONNECT to an IP whose PTR record happens to match would be allowed.
acl anthropic dstdomain -n api.anthropic.com
acl openai dstdomain -n api.openai.com
acl openrouter dstdomain -n openrouter.ai
acl chatsvc  dstdomain -n chat
http_access deny CONNECT !SSL_ports
http_access allow CONNECT anthropic
http_access allow CONNECT openai
http_access allow CONNECT openrouter
http_access allow chatsvc
http_access deny all
cache deny all
# NOT stdio:/dev/stdout: squid drops privileges to user 'proxy' after startup and FATALs
# ("Cannot open '/dev/stdout' for writing"); the image entrypoint already tail -F's this
# file to container stdout, so `docker compose logs proxy` still shows the access log.
access_log stdio:/var/log/squid/access.log
