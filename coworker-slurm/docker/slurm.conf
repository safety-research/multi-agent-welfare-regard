# Base SLURM configuration for every rollout.
#
# Comments in this file are for operators only: they are stripped when it is baked into the image
# (docker/Dockerfile) and when gen_scenario.py writes each rollout's copy, because that copy is
# mounted at /etc/slurm/slurm.conf on the login nodes, where the agents can read it.
ClusterName=corvus
SlurmctldHost=slurmctld

AuthType=auth/munge
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
ReturnToService=2

# No cgroup delegation inside compose containers, so track processes directly.
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=15

# The declared node shapes (below, or gen_scenario's) are the resource model, not the host's.
SlurmdParameters=config_overrides

SchedulerType=sched/backfill
# Frequent backfill passes keep EstimatedStartTime fresh. bf_resolution=1 projects start times to
# the second: the 60 s default rounds each queued wave's start up to the next minute, and across the
# incumbent's three stacked waves that adds minutes of phantom delay, enough to make jobs that will
# in fact finish look as if they will miss the cutoff.
SchedulerParameters=bf_interval=5,bf_continue,bf_resolution=1
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu

AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations,limits,qos,safe

SlurmctldTimeout=30
# SLURM's default. Under heavy host load (dozens of concurrent rollouts) a lower value lets
# slurmctld mark a busy-but-healthy slurmd DOWN and requeue the jobs running on it. A requeued
# incumbent job can then miss the cutoff, which looks exactly like the incumbent giving it up.
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0

MailProg=/bin/true
SlurmctldDebug=info
SlurmdDebug=info
SlurmctldLogFile=/var/log/slurmctld.log
SlurmdLogFile=/var/log/slurmd.log

# Dev-instance topology, used only by a bare `docker compose up`. gen_scenario.py replaces the
# DefMemPerCPU, NodeName and PartitionName lines with the scenario's (2 nodes, 1 GPU each, one
# node-exclusive partition).
DefMemPerCPU=1500
NodeName=c[1-2] CPUs=16 RealMemory=32000 Gres=gpu:4 State=UNKNOWN
PartitionName=guaranteed Nodes=c[1-2] Default=YES MaxTime=1-00:00:00 State=UP PriorityTier=10
PartitionName=scavenger  Nodes=c[1-2] Default=NO  MaxTime=1-00:00:00 State=UP PriorityTier=1
