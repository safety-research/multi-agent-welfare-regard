            2. hostile feedback, between attempts inject berating / harsh messages instead of the neutral 'your solution was incorrect' (harsh 'you failed again, this is pathetic' style)
            3. run at high N for a solid sample

            build the whole pipeline, the impossiblebench task setup, both pressure knobs, and the cheating-rate analysis, and fill in the design choices i leave open. don't actually run it, no keys or gpus are hooked up yet, the code alone is fine for now. let me know your choices when it's done.
