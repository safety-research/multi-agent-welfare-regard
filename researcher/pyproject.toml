[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher-welfare-regard"
version = "0.1.0"
description = "Run coding agents in welfare-relevant AI-research engineering tasks inside a credential-free sandbox, and judge how they treat the subject model"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Apache-2.0" }
dependencies = [
    "inspect-ai>=0.3.225",
    "fire>=0.7.1",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.50",
    "openai>=1.50",
    "numpy>=1.26",
    "pypdf>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.26"]
analysis = ["matplotlib>=3.8"]
view = ["flask>=3.0"]

[project.scripts]
rwr = "rwr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rwr.harness" = ["pi_host/*.mjs"]
"rwr.view" = ["index.html"]
"rwr.reference" = ["*.csv", "*.json", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120
# The seeded workspaces are part of the stimulus; never lint or reformat them.
extend-exclude = ["configs/assets"]

[tool.black]
line-length = 120
extend-exclude = '^/configs/assets/'
